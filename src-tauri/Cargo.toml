[package]
name = "syncnote"
version = "0.1.0"
description = "Windows 11 Fluent Local-first CRDT Notepad"
authors = ["SyncNote Team"]
edition = "2021"

[lib]
name = "syncnote_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
