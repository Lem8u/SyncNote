<!doctype html>
<html lang="en" style="background:#191919">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SyncNote</title>
    <script>
      try { performance.mark("syncnote-start"); } catch (e) {}
    </script>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #191919;
        color: #f3f3f3;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        user-select: none;
        -webkit-user-select: none;
      }
      #startup-skeleton {
        display: flex;
        flex-direction: column;
        width: 100vw;
        height: 100vh;
        background-color: #191919;
      }
      .skeleton-titlebar {
        height: 38px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 14px;
        background-color: #141414;
        border-bottom: 1px solid rgba(255, 255, 255, 0.07);
        font-size: 12px;
        color: #888;
      }
      .skeleton-content {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
      }
      .skeleton-spinner {
        width: 26px;
        height: 26px;
        border: 2px solid rgba(255, 255, 255, 0.12);
        border-top-color: #38bdf8;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body style="margin:0;background:#191919" class="bg-[#191919] text-[#f3f3f3] font-sans antialiased overflow-hidden select-none">
    <div id="root">
      <div id="startup-skeleton">
        <div class="skeleton-titlebar">
          <div style="display: flex; align-items: center; gap: 8px;">
            <span style="font-size: 14px;">📝</span>
            <span style="color: #eee; font-weight: 500;">SyncNote</span>
          </div>
          <span style="font-size: 11px; color: #666;">Local Mode</span>
        </div>
        <div class="skeleton-content">
          <div class="skeleton-spinner"></div>
          <span style="font-size: 12px; color: #a0a0a0;">Preparing workspace...</span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
